name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy-learn-web:
    name: Deploy Learn Web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter @chalista/learn install --frozen-lockfile

      - name: Build
        run: pnpm --filter @chalista/learn build

      - name: Deploy
        run: pnpm --filter @chalista/learn run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: https://api.chalistaacademy.com
          NEXT_PUBLIC_OSM_API_URL: https://nominatim.openstreetmap.org
